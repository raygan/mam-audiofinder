<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wishlist – Book Finder</title>
  {% include "_head.html" %}
</head>
<body>
  <div class="page narrow">
    <header class="topbar">
      <a class="brand" href="/"><img src="/static/logo.png" alt="" /><h1>Book Finder <span class="sub">· Wishlist</span></h1></a>
      <nav class="nav">
        <a href="/">Search</a>
        <button id="themeToggle" type="button" aria-label="Theme">🌓</button>
      </nav>
    </header>

    <p class="muted">
      Saved searches. <strong>Check now</strong> runs one MAM search for that item.
      <span id="usage"></span>
    </p>
    <p id="scheduler" class="muted"></p>
    <div id="status" class="muted status"></div>
    <div id="items"></div>
  </div>

  <script src="/static/common.js?v={{ asset_version }}" defer></script>
  <script src="/static/wishlist.js?v={{ asset_version }}" defer></script>
</body>
</html>
