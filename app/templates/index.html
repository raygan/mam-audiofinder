<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Finder</title>
  {% include "_head.html" %}
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/"><img src="/static/logo.png" alt="" /><h1>Book Finder</h1></a>
      <nav class="nav">
        <a id="wishLink" href="/wishlist/view" title="Saved searches">Wishlist<span id="wishBadge" class="count" style="display:none"></span></a>
        <button id="showHistoryBtn" type="button" title="Download history and import">History</button>
        {% if setup_enabled %}<a href="/setup">Setup</a>{% endif %}
        <button id="themeToggle" type="button" aria-label="Theme">🌓</button>
      </nav>
    </header>

    <form id="searchForm">
      <div class="search-row">
        <input id="q" type="text" placeholder="Search title, author, narrator or series" enterkeyhint="search" autocomplete="off" />
        <button id="searchBtn" type="submit" class="btn-primary">Search</button>
      </div>
      <div class="controls">
        <div class="seg" role="radiogroup" aria-label="What to search">
          <input type="radio" name="media" id="media-audiobook" value="audiobook" checked><label for="media-audiobook">Audiobooks</label>
          <input type="radio" name="media" id="media-ebook" value="ebook"><label for="media-ebook">Ebooks</label>
          <input type="radio" name="media" id="media-both" value="both"><label for="media-both">Both</label>
        </div>
        <select id="sort" aria-label="Sort">
          <option value="default">Sort: default</option>
          <option value="seedersDesc">Most seeders</option>
          <option value="dateDesc">Newest</option>
          <option value="sizeDesc">Largest</option>
        </select>
        <select id="perpage" aria-label="Results per page">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </form>

    <div id="status" class="muted status"></div>

    <table id="results" class="cards" style="display:none">
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Narrator</th>
          <th>Format</th>
          <th class="right">Size</th>
          <th class="right">Seeders</th>
          <th>Uploaded</th>
          <th class="center">Link</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="resultsFooter" style="display:none"></div>

    <section id="historyCard" class="card" style="display:none">
      <h2 style="margin:0 0 .25rem; font-size:1.1rem;">History</h2>
      <table id="history" class="cards">
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Narrator</th>
            <th class="center">Link</th>
            <th>When</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <p id="ingestWarn" class="alert" style="display:none"></p>
    <footer class="footer">Health check: <code id="health">…</code></footer>
  </div>

  <script src="/static/common.js?v={{ asset_version }}" defer></script>
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
</body>
</html>
